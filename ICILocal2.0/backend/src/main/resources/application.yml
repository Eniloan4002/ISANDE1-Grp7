server:
  address: 127.0.0.1
  port: 8081
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
  application:
    name: ici-local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ici_local}
    username: ${DB_USER:ici_local}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
ici:
  import:
    max-file-bytes: 5000000
    max-rows: 20000
    max-columns: 64
    max-cell-chars: 1000
    xlsx:
      max-entries: 200
      max-entry-bytes: 10000000
      min-inflate-ratio: 0.01
      max-text-chars: 10000000
      max-cells: 250000
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
  auth:
    secret: ${JWT_SECRET}
    issuer: ici-local
    ttl-minutes: ${JWT_TTL_MINUTES:15}
