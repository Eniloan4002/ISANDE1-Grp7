server:
  address: 127.0.0.1
  port: 8081
spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: ici-local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ici_local}
    username: ${DB_USER:ici_local}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
ici:
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
  auth:
    secret: ${JWT_SECRET}
    issuer: ici-local
    ttl-minutes: ${JWT_TTL_MINUTES:15}
