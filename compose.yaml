services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ici_local
      POSTGRES_USER: ici_local
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ici_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ici_local -d ici_local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ici_postgres_data:
